# /etc/X11/xorg.conf.d/20-kiosk.conf:
Section "Device"
    Identifier  "kiosk"
    Driver      "fbdev"
    BusID       "spi1.0"
    Option      "fbdev" "/dev/fb1"
EndSection

Section "ServerFlags"
    Option "AutoAddGPU"  "false"   # keep card0/card1 out of the way
    Option "BlankTime"   "0"
    Option "StandbyTime" "0"
    Option "SuspendTime" "0"
    Option "OffTime"     "0"
    Option "DontVTSwitch" "true"   # optional: stops Ctrl+Alt+F2 escaping the kiosk
    Option "DontZap"      "true"   # optional: disables Ctrl+Alt+Backspace
EndSection
